# Project-wide settings. Every .qmd file inherits these unless it overrides them.
#
# How this repo is organized (so it can be remixed for another subject):
#   course/                 CONTENT  (swap this folder for a different subject)
#   brand/                  APPEARANCE: the school's colors, fonts and logos
#   _extensions/chalkline/  CHALKLINE: shortcodes, games, toolbox, page and slide layouts, scripts
#                           (run them with `python chalkline.py ...`)
#   index.qmd               overview page, built automatically from every document's labels

profile:
  default: student           # `quarto render` builds the student site (_quarto-student.yml); --profile teacher builds yours

project:
  type: chalkline            # a Chalkline website: its page, slide and PDF layouts (_extensions/chalkline)
  output-dir: _site          # student build goes here
  execute-dir: project       # Python code runs from the repo root, so "course/..." paths work everywhere
  # Chalkline's own steps before and after each render (the catalog, packets, slide PDFs, slide pictures...)
  # come with `type: chalkline`. Course-specific post-render steps go here:
  post-render:
    - scripts/student_copies.py   # teacher site: a clean Student Edition PDF next to the Teacher Edition (full renders only)
  render:
    - index.qmd
    - families.qmd
    - all-slides.qmd           # every deck as rows of slide pictures
    - "course/**/*.qmd"
  resources:                 # the vocab app and its data, copied into the site as-is (vocab/app/)
    - /vocab/index.html      # the leading / means "from the project folder"; without it these
    - /vocab/app/**          # also match the copies inside _site-teacher/
    - /vocab/data/*.csv
    - /vocab/config.js       # the vocab app's settings for this course
    - /vocab/images/**
    - /brand/fonts/*.ttf     # web fonts, for the vocab app (the print fonts are in the Chalkline extension)
  preview:
    port: 4100               # the site is always at http://localhost:4100
    browser: true            # open it in the browser when the preview starts

brand: brand/_brand.yml      # colors, fonts, logos (see brand/README.md)
vocab-title: "History Vocab"  # name of the vocab app, used on {{< vocab >}} pop-up links
student-site: "https://levinnate-design.github.io/levin_chalkline/"   # published student site for toolbox QR codes

filters:
  - chalkline                # turns content markers into slides/PDF/web output (see _extensions/chalkline)

school: "Mingwan School"     # printed in PDF headers and footers

website:
  title: "Mingwan School · Social Studies"
  favicon: brand/logos/icon-sailboat.svg
  page-navigation: true      # previous/next buttons at the bottom of every page, to flip through
  search:
    location: sidebar
  sidebar:
    style: docked
    logo: brand/logos/icon-sailboat.svg
    logo-alt: "Mingwan School sailboat icon"
    contents:
      - text: "Overview"
        href: index.qmd
      - text: "History vocab 词汇"
        href: vocab/app/index.html   # the vocab app (copied in via resources above)
        icon: book
      - text: "All slides 所有幻灯片"
        href: all-slides.qmd       # every deck as rows of slide pictures, by unit
        icon: grid-3x3-gap
      - text: "Review games 复习游戏"
        href: course/review-games.qmd  # any game, any unit (slides)
        icon: controller
      - text: "Play at home 课后闯关"
        href: course/play.qmd    # one-player games for phones and computers
        icon: phone
      - text: "Command Terms 指令词"
        href: course/references/command-terms.qmd
        icon: card-checklist
      - text: "Assessment Criteria 评估标准"
        href: course/references/assessment-criteria.qmd
        icon: award
      - text: "For families 给家长"
        href: families.qmd       # a welcome, the unit goals, and the files marked for families
        icon: house-heart
      - auto: course/units      # one section per unit folder, titled from its index.qmd
      - auto: course/summatives # one section per summative folder, titled from its index.qmd

# Defaults for each output format. Individual files choose which formats they use.
format:
  html:
    theme: [brand/styles.scss]   # the school's fonts and overrides, after Chalkline's page design
    toc: true
    format-links:              # names for the download links in the right margin
      - {format: typst, text: PDF, icon: file-pdf}
      - docx                   # (at least one plain name, or Quarto lists every format twice)
  typst:
    papersize: a4              # posters override this with papersize: a3
  docx: default
  revealjs:
    theme: [brand/revealjs.scss]   # the school's fonts and overrides, after Chalkline's slide design
    logo: /brand/logos/icon-sailboat.svg
    slide-number: true
    transition: fade                 # none, fade, slide, convex, concave or zoom
    background-transition: fade

execute:
  echo: false                # never show Python code in student materials
  warning: false
  freeze: auto               # full renders reuse saved Python results unless the page changed (see _extensions/chalkline/scripts/freeze_check.py)
