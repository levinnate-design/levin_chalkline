<!--
  Clock overlay for reveal.js slides: shows the current time in the bottom-left corner.

  Included in every slide deck by _extensions/classroom/filter.lua.
  - Press K to show or hide it (remembered on this computer).
  - Drag it anywhere on the screen to reposition it (position is remembered too).
-->
<style>
  #slide-clock {
    position: fixed;
    left: 52px;
    bottom: 10px;
    z-index: 40;
    padding: 3px 14px;
    border-radius: 999px;
    background: rgba(0, 52, 119, 0.9);
    color: #fff;
    font: 600 18px/1.4 system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
  }
  #slide-clock:active { cursor: grabbing; }
  #slide-clock[hidden] { display: none; }
  /* Hide in print/PDF export. */
  @media print { #slide-clock { display: none; } }
</style>

<script>
(function () {
  // Speaker view shows slide previews with "receiver" in the address; it has its own clock.
  if (/[?&]receiver/.test(window.location.search)) return;

  const KEY = "slide-clock-visible";
  const POS_KEY = "slide-clock-pos";
  const clock = document.createElement("div");
  clock.id = "slide-clock";
  clock.title = "Drag to move clock · Press K to hide/show";
  clock.setAttribute("aria-hidden", "true");
  document.body.appendChild(clock);

  function readSetting() {
    try { return localStorage.getItem(KEY) !== "0"; } catch (e) { return true; }
  }
  function saveSetting(on) {
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) { /* private window */ }
  }

  // Restore saved drag position if within viewport
  try {
    const saved = JSON.parse(localStorage.getItem(POS_KEY) || "null");
    if (saved && typeof saved.left === "number" && typeof saved.top === "number") {
      clock.style.left = Math.max(4, Math.min(window.innerWidth - 100, saved.left)) + "px";
      clock.style.top = Math.max(4, Math.min(window.innerHeight - 40, saved.top)) + "px";
      clock.style.bottom = "auto";
    }
  } catch (e) {}

  // Make clock draggable with mouse or touch
  let dragging = false, offX = 0, offY = 0;
  clock.addEventListener("pointerdown", function (e) {
    if (e.button && e.button !== 0) return;
    dragging = true;
    const rect = clock.getBoundingClientRect();
    offX = e.clientX - rect.left;
    offY = e.clientY - rect.top;
    clock.setPointerCapture(e.pointerId);
    e.preventDefault();
    e.stopPropagation();
  });
  clock.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    const x = Math.max(4, Math.min(window.innerWidth - clock.offsetWidth - 4, e.clientX - offX));
    const y = Math.max(4, Math.min(window.innerHeight - clock.offsetHeight - 4, e.clientY - offY));
    clock.style.left = x + "px";
    clock.style.top = y + "px";
    clock.style.bottom = "auto";
    clock.style.right = "auto";
  });
  clock.addEventListener("pointerup", function (e) {
    if (!dragging) return;
    dragging = false;
    try {
      const rect = clock.getBoundingClientRect();
      localStorage.setItem(POS_KEY, JSON.stringify({ left: Math.round(rect.left), top: Math.round(rect.top) }));
    } catch (err) {}
  });

  function update() {
    // Uses the computer's own 12- or 24-hour setting.
    clock.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  clock.hidden = !readSetting();
  update();
  setInterval(update, 1000);

  function toggle() {
    clock.hidden = !clock.hidden;
    saveSetting(!clock.hidden);
  }

  if (window.Reveal) {
    Reveal.addKeyBinding({ keyCode: 75, key: "K", description: "Show/hide clock" }, toggle);
  } else {
    document.addEventListener("keydown", function (e) { if (e.key === "k" || e.key === "K") toggle(); });
  }
})();
</script>
