<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #667085; --line: #e3e6ea;
    --accent: #0a6cc4; --accent-soft: #e6f0fa; --chip: #f0f2f5;
    --l1: #2f9e44; --l2: #e8890c; --l3: #c2255c; --ref-head: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171b; --panel: #1d2126; --text: #e8eaed; --muted: #9aa3ad; --line: #2c3238;
            --accent: #5aa9f0; --accent-soft: #1f3347; --chip: #262b31; --ref-head: #ff922b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel);
           border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  header input[type=search] { flex: 1; min-width: 160px; padding: 7px 10px; border: 1px solid var(--line);
           border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  header label { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 53px); }
  nav { border-right: 1px solid var(--line); padding: 10px 8px; background: var(--panel); overflow-y: auto;
        position: sticky; top: 53px; align-self: start; max-height: calc(100vh - 53px); }
  nav a { display: flex; justify-content: space-between; padding: 5px 10px; border-radius: 6px; color: var(--text);
          text-decoration: none; font-size: 14px; }
  nav a:hover { background: var(--chip); }
  nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav a.domain { font-weight: 600; margin-top: 4px; }
  nav a.domain::before { content: "▸"; display: inline-block; width: 14px; color: var(--muted); font-weight: 400; }
  nav a.domain.open::before { content: "▾"; }
  nav a.domain > span:first-child { flex: 1; }
  nav a.sub { padding-left: 22px; color: var(--muted); }
  nav a.sub.active { color: var(--accent); }
  nav .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  #refs { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
  #refs summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 5px 10px; border-radius: 6px; }
  #refs summary:hover { background: var(--chip); }
  #refs h3 { margin: 12px 10px 2px; font-size: 11px; font-weight: 700; color: var(--ref-head); text-transform: uppercase; letter-spacing: .04em; }
  #refs a { display: block; padding: 4px 10px; font-size: 13px; }
  #refs .ext { color: var(--muted); font-size: 11px; }
  #refs a.key { font-weight: 600; }
  nav .sub-zh { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); line-height: 1.25; }
  .hide-zh nav .sub-zh, .hide-zh #refs .zh-text { display: none; }
  #refs h3 .zh-text { text-transform: none; letter-spacing: 0; margin-left: 4px; }
  #refs .sum-zh { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
  nav a { align-items: flex-start; }
  #refs .star { color: var(--ref-head); margin-right: 3px; }
  main { padding: 16px; overflow-y: auto; }
  main h2 { margin: 0 0 12px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
          cursor: pointer; display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; color: inherit;
          text-decoration: none; }
  .card:hover { border-color: var(--accent); }
  .thumb { aspect-ratio: 1; background: #fff; border-radius: 6px; display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb .none { color: #aab; font-size: 13px; }
  .card .en { font-weight: 600; }
  .card .zh { color: var(--muted); }
  .lvl { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; border-radius: 4px; padding: 0 5px; }
  .lvl-1 { background: var(--l1); } .lvl-2 { background: var(--l2); } .lvl-3 { background: var(--l3); }
  .detail { display: grid; grid-template-columns: minmax(200px, 340px) 1fr; gap: 20px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .detail .thumb { border: 1px solid var(--line); }
  .detail h2 { font-size: 26px; margin: 0; }
  .detail .zh { font-size: 22px; color: var(--muted); margin: 2px 0 10px; }
  .detail .short { font-size: 17px; margin: 0 0 10px; }
  .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 14px 0 0; font-size: 14px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; }
  .chip { display: inline-block; background: var(--chip); border-radius: 6px; padding: 1px 7px; margin: 0 4px 4px 0;
          font-size: 13px; color: var(--text); text-decoration: none; }
  a.chip:hover { background: var(--accent-soft); color: var(--accent); }
  .back { display: inline-block; margin-bottom: 10px; color: var(--accent); text-decoration: none; }
  .hide-zh .zh-text { display: none; }
  .thumb .sb { width: 100%; height: 100%; display: grid; place-items: center; padding: 8px; }
  .thumb .sb svg { max-width: 100%; max-height: 100%; height: auto; }
  .blocks-big { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
  pre.py { margin: 0; background: var(--chip); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-size: 14px; }
  .learn { display: inline-block; margin-top: 14px; color: var(--accent); font-weight: 600; text-decoration: none; }
  .learn:hover { text-decoration: underline; }
  .error { background: #fde8e8; color: #8a1c1c; padding: 12px; border-radius: 8px; }
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; }
    #nav { display: flex; flex-wrap: wrap; gap: 4px; }
    #nav a { white-space: nowrap; margin: 0; gap: 6px; background: var(--chip); }
    #refs { margin-top: 8px; }
    #nav .sub-zh { display: inline; margin-left: 4px; }
    nav a.domain::before { display: none; }
    nav .subs { flex-basis: 100%; display: flex; gap: 4px; overflow-x: auto; padding-top: 2px; }
    nav a.sub { padding-left: 10px; }
    .detail { grid-template-columns: 1fr; }
  }
  header .home { display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
  header .home img { height: 28px; }
  header .back { color: var(--muted); font-size: 14px; text-decoration: none; white-space: nowrap; }
  header .back:hover { color: var(--accent); }
  .say { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; cursor: pointer;
         font-size: 0.6em; padding: 2px 8px; vertical-align: middle; }
  .say:hover { border-color: var(--accent); }
  .zh .say { font-size: 0.75em; }
  .no-speech .say { display: none; }
</style>
<!-- Colors and fonts from brand/_brand.yml (brand.css, made by Chalkline's scripts/vocab_app.py, which also copies this
     app into the course's vocab/app/ and fills in the logo, when the site builds). -->
<link rel="stylesheet" href="brand.css">
</head>
<body>
<header>
  <a class="back" href="../../index.html">← Course site</a>
  <a class="home" href="#"><img src="CHALKLINE_LOGO" alt=""><h1>Vocab</h1></a>
  <input type="search" id="q" placeholder="Search English, 中文, definitions…">
  <label><input type="checkbox" id="zh" checked> 中文</label>
</header>
<div class="layout">
  <nav><div id="nav"></div><details id="refs"><summary>Quick references <span class="zh-text sum-zh">快速参考</span></summary><div id="refs-list"></div></details></nav>
  <main id="main"></main>
</div>
<script src="vendor/scratchblocks.min.js"></script>
<script src="../config.js"></script>
<script>
// Where the data lives, relative to this page (app/ sits next to data/ and images/).
const DATA = "../data/vocab.csv", IMAGES = "../images/";

// The course's own settings (title, topic names, quick references) live in ../config.js.
const CFG = window.VOCAB_CONFIG || {};
const DOMAIN_NAMES = CFG.domainNames || {}, DOMAIN_ZH = CFG.domainZh || {};
const SUB_ZH = CFG.subdomainZh || {}, SUB_NAMES = CFG.subdomainNames || {};
const REFS = CFG.refs || [];
// A subdomain's 中文 can depend on its domain ("events" in COMP vs CODE): subdomainZhByDomain["COMP/events"].
const subZh = (d, s) => (CFG.subdomainZhByDomain || {})[d + "/" + s] || SUB_ZH[s] || "";
if (CFG.title) { document.title = CFG.title; document.querySelector("header h1").textContent = CFG.title; }


let rows = [], byId = {}, ver = "";

// Minimal RFC 4180 CSV parser (quoted fields, "" escapes, newlines in quotes).
function parseCSV(text) {
  const out = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); out.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); out.push(row); }
  const [head, ...body] = out;
  return body.filter(r => r.some(Boolean)).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const list = s => (s || "").split(";").map(x => x.trim()).filter(Boolean);   // (a course may not have every column)
const titleSub = s => SUB_NAMES[s] || s.replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
const thumb = r => `<div class="thumb">${r.image ? `<img src="${IMAGES}${esc(r.image)}${ver}" alt="${esc(r.term_en)}" loading="lazy">`
                                         : r.blocks ? `<div class="sb" data-blocks="${esc(r.id)}"></div>`
                                         : `<span class="none">no image</span>`}</div>`;

// ---- Drawing VEXcode blocks with scratchblocks -------------------------------------------
// VEX-specific blocks aren't in Scratch, so scratchblocks doesn't know their color. We give each
// one the Scratch category whose color VEXcode uses, picked from the subdomain or the first word.
const SUB_CATEGORY = { drivetrain: "motion", motion: "motion", sensing: "sensing", vision: "sensing",
  controller: "sensing", "screen-console": "looks", events: "events", control: "control",
  operators: "operators", variables: "variables", functions: "custom" };
function categoryFor(line, sub) {
  if (/^when /.test(line)) return "events hat";
  if (/^(drive|turn|spin|stop driving|set drive|set \[Motor)/.test(line)) return "motion";
  return SUB_CATEGORY[sub] || "sensing";
}
function blockSVG(r) {
  if (!window.scratchblocks) return null;
  const doc = scratchblocks.parse(r.blocks, { languages: ["en"] });
  // Recolor every block scratchblocks didn't recognize ("obsolete" = red), including nested ones.
  const fix = (node, top) => {
    if (!node || typeof node !== "object") return;
    if (node.info && node.info.category === "custom-arg") node.info.category = "custom";   // no scratch3 color for it
    if (node.info && node.info.category === "obsolete") {
      const text = (node.children || []).map(c => c.value ?? c.label?.value ?? "").join(" ").trim();
      const cat = top ? categoryFor(text, r.subdomain) : "sensing";
      node.info.category = cat.split(" ")[0];
      if (cat.endsWith("hat")) node.info.shape = "hat";
    }
    (node.children || []).forEach(c => fix(c, false));
    (node.blocks || []).forEach(b => fix(b, true));
  };
  doc.scripts.forEach(sc => fix(sc, true));
  return scratchblocks.render(doc, { style: "scratch3", scale: 0.75 });
}
function drawBlocks(root) {
  root.querySelectorAll("[data-blocks]").forEach(el => {
    try { const svg = blockSVG(byId[el.dataset.blocks]); if (svg) el.replaceChildren(svg); } catch (e) { el.textContent = byId[el.dataset.blocks].blocks; }
  });
}

function buildRefs() {
  if (!REFS.length) { document.getElementById("refs").hidden = true; return; }
  document.getElementById("refs-list").innerHTML = REFS.map(([group, gzh, links]) => `<h3>${esc(group)} <span class="zh-text">${esc(gzh)}</span></h3>` +
    links.map(([label, zh, url, key]) => `<a href="${esc(url)}" target="_blank" rel="noopener"${key ? ' class="key"' : ""}>${key ? '<span class="star">★</span>' : ""}${esc(label)} <span class="ext">↗</span><span class="sub-zh zh-text">${esc(zh)}</span></a>`).join("")).join("");
  // Open on wide screens; on phones it starts folded so the term list stays near the top.
  document.getElementById("refs").open = window.matchMedia("(min-width: 701px)").matches;
}

function buildNav(active) {
  const tree = {};
  for (const r of rows) ((tree[r.domain] ??= {})[r.subdomain] ??= []).push(r);
  let html = `<a href="#" class="${active === "" ? "active" : ""}"><span>All<span class="sub-zh zh-text">全部</span></span> <span class="count">${rows.length}</span></a>`;
  // Accordion: every domain is listed, but only the open one (the domain being viewed) shows its subdomains.
  const open = (active || "").split("/")[0];
  for (const [d, subs] of Object.entries(tree)) {
    const n = Object.values(subs).flat().length;
    html += `<a href="#${d}" class="domain ${d === open ? "open" : ""} ${active === d ? "active" : ""}"><span>${esc(DOMAIN_NAMES[d] || d)}<span class="sub-zh zh-text">${esc(DOMAIN_ZH[d] || "")}</span></span> <span class="count">${n}</span></a>`;
    if (d !== open) continue;
    html += `<div class="subs">`;
    for (const [s, items] of Object.entries(subs))
      html += `<a href="#${d}/${s}" class="sub ${active === d + "/" + s ? "active" : ""}"><span>${esc(titleSub(s))}<span class="sub-zh zh-text">${esc(subZh(d, s))}</span></span> <span class="count">${items.length}</span></a>`;
    html += `</div>`;
  }
  document.getElementById("nav").innerHTML = html;
}

function showGrid(title, items) {
  document.getElementById("main").innerHTML = `<h2>${esc(title)} <span class="count" style="color:var(--muted);font-weight:400">${items.length}</span></h2>
    <div class="grid">${items.map(r => `
      <a class="card" href="#id=${r.id}">${thumb(r)}
        <span class="en">${esc(r.term_en)}</span>
        <span class="zh zh-text">${esc(r.zh)}</span>
        <span><span class="lvl lvl-${r.level}">L${r.level}</span></span>
      </a>`).join("")}</div>`;
  drawBlocks(document.getElementById("main"));
}

// 🔊 buttons on a term's page: read the word aloud in English or 中文 with the computer's voices.
const sayBtn = (text, lang, label) =>
  `<button type="button" class="say" data-say="${esc(text)}" data-lang="${lang}" aria-label="${label}" title="${label}">🔊</button>`;
  // Read a word aloud with the computer's own voices (Web Speech API): no internet needed.
  // Picks a voice for the language if one is installed (e.g. Tingting on a Mac, Huihui on Windows).
  // Natural-sounding voices first (macOS, Windows, Chrome), and never the novelty ones
  // (macOS has Bubbles, Zarvox, Grandpa…), then anything else in the right language.
  const GOOD = /^(Samantha|Tingting|Li-Mu|Yu-shu|Microsoft (Aria|Jenny|Guy|Zira|David|Xiaoxiao|Yunxi|Huihui|Kangkang|Yaoyao)|Google (US English|普通话))/;
  const NOVELTY = /^(Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Albert|Fred|Junior|Ralph|Kathy|Nicky)\b/;
  function pickVoice(voices, lang) {
    const want = lang.toLowerCase(), base = want.split("-")[0];
    const fits = voices.filter(v => !NOVELTY.test(v.name) && v.lang.toLowerCase().replace("_", "-").startsWith(base));
    const exact = fits.filter(v => v.lang.toLowerCase().replace("_", "-") === want);
    return exact.find(v => GOOD.test(v.name)) || fits.find(v => GOOD.test(v.name)) || exact[0] || fits[0] || null;
  }
  function say(text, lang) {
    const s = window.speechSynthesis;
    if (!s || !text) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.9;
    u.voice = pickVoice(s.getVoices(), lang);
    s.speak(u);
  }
  if (!window.speechSynthesis) document.documentElement.classList.add("no-speech");
document.getElementById("main").addEventListener("click", e => {
  const b = e.target.closest(".say");
  if (b) { e.preventDefault(); say(b.dataset.say, b.dataset.lang); }
});

function showDetail(r) {
  const refs = list(r.confused_with).map(id => byId[id]).filter(Boolean)
    .map(x => `<a class="chip" href="#id=${x.id}">${esc(x.term_en)}</a>`).join("");
  const field = (label, v) => v ? `<dt>${label}</dt><dd>${v}</dd>` : "";
  document.getElementById("main").innerHTML = `
    <a class="back" href="#${r.domain}/${r.subdomain}">← ${esc(DOMAIN_NAMES[r.domain] || r.domain)} / ${esc(titleSub(r.subdomain))}</a>
    <div class="detail">${thumb(r)}
      <div>
        <h2>${esc(r.term_en)} ${sayBtn(r.term_en, "en-US", "Say it in English")} <span class="lvl lvl-${r.level}">L${r.level}</span></h2>
        <div class="zh zh-text">${esc(r.zh)} ${r.zh ? sayBtn(r.zh, "zh-CN", "Say it in Chinese") : ""}</div>
        <p class="short">${esc(r.short_def)}</p>
        ${r.explanation ? `<p>${esc(r.explanation)}</p>` : ""}
        ${r.example ? `<p><em>“${esc(r.example)}”</em></p>` : ""}
        <dl>
          ${field("Also called", list(r.aka).map(a => `<span class="chip">${esc(a)}</span>`).join(""))}
          ${field("Confused with", refs)}
          ${field("Blocks", r.blocks && `<div class="blocks-big" data-blocks="${esc(r.id)}">${esc(r.blocks)}</div>`)}
          ${field("Python", r.python && `<pre class="py"><code>${esc(r.python)}</code></pre>`)}
          ${field("Tags", list(r.tags).map(t => `<span class="chip">${esc(t)}</span>`).join(""))}
          ${field("Store SKUs", list(r.store_skus).map(s => `<span class="chip">${esc(s)}</span>`).join(""))}
          ${field("ID · status", `${esc(r.id)} · ${esc(r.status)}`)}
        </dl>
        ${r.ref_url ? `<a class="learn" href="${esc(r.ref_url)}" target="_blank" rel="noopener">Learn more ↗</a>` : ""}
      </div>
    </div>`;
  drawBlocks(document.getElementById("main"));
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (q) {
    buildNav(null);
    const hits = rows.filter(r => [r.term_en, r.aka, r.zh, r.short_def, r.explanation, r.tags]
      .some(v => v.toLowerCase().includes(q)));
    return showGrid(`Search: “${q}”`, hits);
  }
  if (h.startsWith("id=") && byId[h.slice(3)]) { const r = byId[h.slice(3)]; buildNav(`${r.domain}/${r.subdomain}`); return showDetail(r); }
  buildNav(h);
  const [d, s] = h.split("/");
  if (!d) return showGrid("All terms", rows);
  const items = rows.filter(r => r.domain === d && (!s || r.subdomain === s));
  showGrid(s ? `${DOMAIN_NAMES[d] || d} / ${titleSub(s)}` : (DOMAIN_NAMES[d] || d), items);
}

const zhBox = document.getElementById("zh");
try { zhBox.checked = localStorage.getItem("showZh") !== "0"; } catch {}
const applyZh = () => { document.body.classList.toggle("hide-zh", !zhBox.checked);
                        try { localStorage.setItem("showZh", zhBox.checked ? "1" : "0"); } catch {} };
zhBox.addEventListener("change", applyZh); applyZh();
buildRefs();
document.getElementById("q").addEventListener("input", route);
addEventListener("hashchange", () => { document.getElementById("q").value = ""; route(); });

// "no-cache" makes the browser check for a newer CSV on every load (GitHub Pages otherwise lets it
// reuse a copy for 10 minutes). Image URLs carry the CSV's date so replaced images refresh too.
fetch(DATA, { cache: "no-cache" }).then(r => {
    if (!r.ok) throw new Error(`${DATA}: HTTP ${r.status}`);
    const lm = r.headers.get("last-modified");
    if (lm) ver = "?v=" + Date.parse(lm);
    return r.text(); })
  .then(t => { rows = parseCSV(t); byId = Object.fromEntries(rows.map(r => [r.id, r])); route(); })
  .catch(e => { document.getElementById("main").innerHTML =
    `<div class="error">Couldn't load the vocab list (${esc(e.message)}).<br>Open this page through a web server, not as a file — e.g. run <code>python3 -m http.server</code> in the repo folder and go to <code>http://localhost:8000/app/</code>.</div>`; });
</script>
</body>
</html>
