# Column definitions and allowed values for data/*.csv.
# validate.py reads this file. Change allowed values here, not in the script.
# Domains are the ID prefix: GRC = Ancient Greece, ROM = Ancient Rome. Add your own the same way
# (and give them names in config.js).

levels: [1, 2, 3]          # 1 = everyone, 2 = going further, 3 = expert
statuses: [draft, reviewed, verified]
list_separator: ";"

vocab:
  file: data/vocab.csv
  id_pattern: "^(RIV|GRC|ROM|ECO|CMD)-\\d{3}$"
  columns:
    - {name: id,            required: true}
    - {name: term_en,       required: true}
    - {name: aka}
    - {name: zh,            required_when_status: [verified]}
    - {name: short_def,     required: true, max_length: 75}
    - {name: explanation}
    - {name: example,       warn_if_missing_when_status: [verified]}
    - {name: confused_with, list: true, refs: vocab}
    - {name: domain,        required: true}
    - {name: subdomain,     required: true}
    - {name: tags,          list: true}
    - {name: level,         required: true}
    - {name: image,         file_in: images}
    - {name: ref_url,       pattern: "^https://"}  # one 'learn more' link
    - {name: status,        required: true}

  domains:
    RIV: [geography, mesopotamia, egypt, indus]
    GRC: [geography, government, culture]
    ROM: [government, army, daily-life, engineering]
    ECO: [systems]
    CMD: [knowing, investigating, communicating, thinking]

frames:
  file: data/frames.csv
  id_pattern: "^FRM-\\d{3}$"
  columns:
    - {name: id,        required: true}
    - {name: situation, required: true, allowed: [discussion, writing]}
    - {name: function,  required: true, allowed: [agree, disagree, explain, compare, ask]}
    - {name: frame_en,  required: true}
    - {name: zh,        required_when_status: [verified]}
    - {name: example}
    - {name: level,     required: true}
    - {name: vocab_ids, list: true, refs: vocab}
    - {name: notes}
    - {name: status,    required: true}
