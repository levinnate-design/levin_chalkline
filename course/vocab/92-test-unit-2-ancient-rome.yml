unit: 92
unit_title: "TEST UNIT 2: Ancient Rome"
terms:
- term: republic
  definition: Government where citizens elect leaders to rule for them.
  example: In the republic, no one could be king.
  notes: Rome became a republic in 509 BC after it removed its last king. The republic lasted almost 500 years.
  zh: 共和国
  image: ROM-001.svg
  vex_id: ROM-001
- term: senate
  definition: A council of important men who advised Rome's leaders.
  example: The senate met to discuss the war.
  notes: Senators usually served for life. The senate controlled money and talked with other countries.
  zh: 元老院
  image: ROM-002.svg
  vex_id: ROM-002
- term: consul
  definition: One of two top leaders of the Roman Republic, chosen for one year.
  example: Each year, Rome had two new consuls.
  notes: Every year, citizens elected two consuls. They shared power so that neither one could become a king.
  zh: 执政官
  image: ROM-003.svg
  vex_id: ROM-003
- term: emperor
  definition: A single ruler of an empire, usually for life.
  example: The emperor's face was on every coin.
  notes: Augustus became the first Roman emperor in 27 BC. After him, emperors ruled Rome for hundreds of years.
  zh: 皇帝
  image: ROM-004.svg
  vex_id: ROM-004
- term: empire
  definition: Many lands and peoples ruled by one government.
  example: The empire's roads ran from Britain to Egypt.
  notes: At its largest, the Roman Empire went all the way around the Mediterranean Sea. Its western half fell in AD 476.
  zh: 帝国
  image: ROM-005.svg
  vex_id: ROM-005
- term: forum
  definition: The main public square of a Roman town.
  example: Let's meet in the forum after the market opens.
  notes: The Forum in Rome began as a market. Later it had temples, law courts and government buildings around it.
  zh: 古罗马广场
  image: ROM-006.svg
  vex_id: ROM-006
- term: Latin
  definition: The language of the ancient Romans.
  example: Aqua means water in Latin.
  notes: Italian, Spanish, French, Portuguese and Romanian all grew out of Latin. Many English words come from it too.
  zh: 拉丁语
  image: ROM-007.svg
  vex_id: ROM-007
- term: Roman numerals
  definition: 'Letters used as numbers: I, V, X, L, C, D, M.'
  example: The clock shows XII at the top.
  notes: 'I = 1, V = 5, X = 10, L = 50, C = 100, D = 500, M = 1000. Add them: XII = 12. A smaller one before a bigger one subtracts: IV = 4.'
  zh: 罗马数字
  image: ROM-008.svg
  vex_id: ROM-008
- term: gladiator
  definition: A trained fighter who fought in an arena to entertain crowds.
  example: The gladiator carried a shield and a short sword.
  notes: Most gladiators were enslaved people or prisoners. Huge crowds watched them fight in arenas like the Colosseum.
  zh: 角斗士
  image: ROM-009.svg
  vex_id: ROM-009
- term: Colosseum
  definition: A huge stone arena in Rome for games and shows.
  example: The Colosseum had 80 entrances, so crowds left quickly.
  notes: Finished in AD 80, it held about 50,000 people. It is the largest ancient amphitheater ever built.
  zh: 罗马斗兽场
  image: ROM-010.svg
  vex_id: ROM-010
- term: aqueduct
  definition: A channel or bridge that carries water to a city.
  example: The aqueduct brought fresh water to the public baths.
  notes: 'Aqueducts used gravity: the water channel sloped gently downhill all the way. The Pont du Gard in France still stands.'
  zh: 引水渠
  image: ROM-011.svg
  vex_id: ROM-011
- term: legion
  definition: A large unit of the Roman army, about 5,000 soldiers.
  example: The legion built a road as it marched.
  notes: Legionaries were Roman citizens. Besides fighting, they built roads, bridges and forts.
  zh: 军团
  image: ROM-012.svg
  vex_id: ROM-012
