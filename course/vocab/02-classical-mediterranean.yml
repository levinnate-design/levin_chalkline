unit: 2
unit_title: Classical Mediterranean Foundations
terms:
- term: city-state
  definition: A city and the land around it, with its own government.
  example: Athens and Sparta were rival city-states.
  notes: Ancient Greece was not one country. It had hundreds of city-states, each with its own laws, army and money. Athens and Sparta were the most famous.
  zh: 城邦
  image: GRC-002.svg
  vex_id: GRC-002
- term: democracy
  definition: Government where citizens make decisions by voting.
  example: In a democracy, every citizen gets a vote.
  notes: 'Athens started a democracy around 508 BC. The word comes from Greek: demos means people and kratos means power.'
  zh: 民主
  image: GRC-003.svg
  vex_id: GRC-003
- term: citizen
  definition: A member of a city-state with rights, like the right to vote.
  example: Only citizens could speak in the Assembly.
  notes: In Athens, only free men with Athenian parents were citizens. Women, enslaved people and foreigners could not vote.
  zh: 公民
  image: GRC-004.svg
  vex_id: GRC-004
- term: assembly
  definition: A meeting where citizens discuss and vote on laws.
  example: The Assembly voted to build new warships.
  notes: The Athenian Assembly met on a hill called the Pnyx. Thousands of citizens came to listen, argue and vote.
  zh: 公民大会
  image: GRC-005.svg
  vex_id: GRC-005
- term: direct democracy
  definition: People vote on laws themselves instead of electing representatives.
  example: 'Athens practised direct democracy: thousands of men voted on one hillside.'
  notes: In Athens, citizens did not choose politicians to decide for them. They walked to the Pnyx hill, debated in the Assembly (Ecclesia), and voted on laws and war in person. Pericles paid poor citizens a daily wage so they could take the day off work to serve.
  zh: 直接民主
  image: GRC-014.svg
  vex_id: GRC-014
- term: oligarchy
  definition: Government run by a small group of rich or military leaders.
  example: Sparta was an oligarchy, so only a few leaders made decisions.
  notes: 'An oligarchy is the opposite of a democracy: power belongs to a few people instead of the whole community. Sparta was a military oligarchy ruled by two kings, a council of elders and five overseers.'
  zh: 寡头政治
  image: GRC-015.svg
  vex_id: GRC-015
- term: helot
  definition: A state-owned farm worker in Sparta who could not leave the land.
  example: Helots farmed the land so Spartan men could train as soldiers.
  notes: 'Sparta conquered its neighbour Messenia and forced the people there to farm for the Spartans. Helots fed their conquerors, but they were not private property: the whole state owned them. They outnumbered Spartan citizens about eight to one, so Sparta lived in constant fear of revolt.'
  zh: 希洛人（国家农奴）
  image: GRC-016.svg
  vex_id: GRC-016
- term: social hierarchy
  definition: Ranking people in groups from most to least power and rights.
  example: Enslaved people sat at the bottom of Athens' social hierarchy.
  notes: Ancient societies ranked people by birth, wealth, gender and freedom. In Athens only free adult men born to two Athenian parents were citizens; women, metics and enslaved people had fewer or no rights.
  zh: 社会等级制度
  image: GRC-017.svg
  vex_id: GRC-017
- term: metic
  definition: A foreign resident of Athens who paid taxes but could not vote.
  example: A metic paid his taxes, yet the Assembly would not let him vote.
  notes: Metics were traders and craftspeople who moved to Athens from other cities. They paid taxes and rowed in the Athenian navy, but they were never allowed to vote, speak in the Assembly or own land.
  zh: 外邦人（常住外籍居民）
  image: GRC-018.svg
  vex_id: GRC-018
- term: Hellenistic civilization
  definition: The blended Greek, Persian, Egyptian and Indian culture after Alexander.
  example: Hellenistic cities traded Greek ideas even far from Greece.
  notes: Alexander the Great's armies reached Egypt, Persia and the Indus valley. When his empire broke apart, the Greek cities he founded kept mixing Greek language, art and science with the older cultures around them. Historians call this blend Hellenistic.
  zh: 希腊化文明
  image: GRC-019.svg
  vex_id: GRC-019
- term: cultural diffusion
  definition: The spread of ideas, beliefs, and technology from one culture to another.
  example: Through long-distance trade, cultural diffusion spread Sumerian ideas across Southwest Asia.
  notes: As river valley cities traded and migrated, they exchanged goods, writing systems, religious ideas, and technologies like bronze-working and chariots.
  zh: 文化传播
  image: RIV-006.svg
  vex_id: RIV-006
- term: theocracy
  definition: Government in which rule is based on religious authority.
  example: Ancient Egypt was a theocracy because its king was also worshipped as a god.
  notes: Because the pharaoh stood at the center of both Egypt's religion and its government and army, Egypt's system of rule was a theocracy.
  zh: 神权政治
  image: RIV-019.svg
  vex_id: RIV-019
- term: hydraulic empire
  definition: A kingdom whose power comes from controlling big river irrigation.
  example: Egypt was a hydraulic empire built on Nile canals and dykes.
  notes: 'Digging canals, raising dykes and storing flood water needed thousands of workers under one command. Historians call states built on that coordination hydraulic empires: the pharaohs of Egypt and the kings of Mesopotamia ruled as god-kings because the water system needed one absolute authority.'
  zh: 水利专制帝国
  image: RIV-033.svg
  vex_id: RIV-033
- term: corvee labor
  definition: Unpaid work the state forces peasants to do, like building dykes.
  example: Peasants gave corvee labor to raise dykes during the flood.
  notes: During the Nile flood, when fields lay under water, Egyptian officials conscripted tens of thousands of farmers to haul stone for pyramids, cut canals and repair dykes. The workers were legally free, but their labour belonged to the pharaoh.
  zh: 劳役制（国家强迫劳役）
  image: RIV-034.svg
  vex_id: RIV-034
- term: lex talionis
  definition: A punishment that matches the injury, like 'an eye for an eye'.
  example: Under lex talionis, Hammurabi's judges scaled punishment to rank.
  notes: 'The Code of Hammurabi carved 282 rulings using this principle, but scaled them to social rank: blinding a noble cost the attacker an eye, while blinding an enslaved person cost only a silver fine.'
  zh: 同态复仇法（以眼还眼）
  image: RIV-035.svg
  vex_id: RIV-035
- term: continuity
  definition: Something that stays the same across long periods of history.
  example: Unfree labour is a continuity shared by every ancient civilization.
  notes: 'History mixes change and continuity. Government changed hugely between the river valleys and the Mediterranean — god-kings gave way to assemblies — but forced labour stayed: corvee gangs became mine slaves and latifundia field hands.'
  zh: 历史延续性
  image: RIV-036.svg
  vex_id: RIV-036
- term: republic
  definition: Government where citizens elect leaders to rule for them.
  example: In the republic, no one could be king.
  notes: Rome became a republic in 509 BC after it removed its last king. The republic lasted almost 500 years.
  zh: 共和国
  image: ROM-001.svg
  vex_id: ROM-001
- term: senate
  definition: A council of important men who advised Rome's leaders.
  example: The senate met to discuss the war.
  notes: Senators usually served for life. The senate controlled money and talked with other countries.
  zh: 元老院
  image: ROM-002.svg
  vex_id: ROM-002
- term: consul
  definition: One of two top leaders of the Roman Republic, chosen for one year.
  example: Each year, Rome had two new consuls.
  notes: Every year, citizens elected two consuls. They shared power so that neither one could become a king.
  zh: 执政官
  image: ROM-003.svg
  vex_id: ROM-003
- term: empire
  definition: Many lands and peoples ruled by one government.
  example: The empire's roads ran from Britain to Egypt.
  notes: At its largest, the Roman Empire went all the way around the Mediterranean Sea. Its western half fell in AD 476.
  zh: 帝国
  image: ROM-005.svg
  vex_id: ROM-005
- term: forum
  definition: The main public square of a Roman town.
  example: Let's meet in the forum after the market opens.
  notes: The Forum in Rome began as a market. Later it had temples, law courts and government buildings around it.
  zh: 古罗马广场
  image: ROM-006.svg
  vex_id: ROM-006
- term: Twelve Tables
  definition: Rome's first written laws, carved on bronze for all to read.
  example: The Twelve Tables hung in the Forum where citizens could read them.
  notes: Before 451 BCE, patrician judges kept the law unwritten and interpreted it in secret, usually in favour of their own families. Plebeians demanded that the rules be published, so ten officials wrote them on twelve bronze tablets and hung them in the Forum. The code gave free citizens due process, but it also treated enslaved people as property.
  zh: 《十二铜表法》
  image: ROM-013.svg
  vex_id: ROM-013
- term: due process
  definition: Fair, public steps a court must follow before punishing someone.
  example: Under due process, the accuser had to prove his charge in public.
  notes: Due process means the accuser must bring proof, witnesses must be heard, and the trial must be public. The Twelve Tables gave these rights to free Roman citizens — but not to enslaved people, who could be hurt or killed with no trial at all.
  zh: 法定正当程序
  image: ROM-014.svg
  vex_id: ROM-014
- term: patrician
  definition: A rich, land-owning Roman noble born into political power.
  example: Wealthy patricians filled the seats of the Roman Senate.
  notes: Patricians were Rome's hereditary aristocracy. They held almost every priesthood and judgeship, filled the seats of the Senate, and owned the largest farms. Their wealth came from land conquered by Rome's legions.
  zh: 贵族（土地所有者）
  image: ROM-015.svg
  vex_id: ROM-015
- term: plebeian
  definition: 'A free Roman commoner: farmer, craft worker, soldier or trader.'
  example: Plebeian farmers marched in the legions and voted for tribunes.
  notes: Plebeians were the majority of free Romans. They paid taxes and made up most of the legions, but they began with almost no political power. Over two centuries they fought for the right to elect tribunes and to hold public office.
  zh: 平民（普通公民）
  image: ROM-016.svg
  vex_id: ROM-016
- term: tribune
  definition: An official elected by plebeians to protect them from patricians.
  example: A tribune shouted veto to stop a patrician judge.
  notes: Ten tribunes were elected each year. Their bodies were legally sacrosanct — attacking one was a capital crime — and each could stand in the Forum and shout 'veto' to cancel a magistrate's decision that hurt a plebeian.
  zh: 保民官
  image: ROM-017.svg
  vex_id: ROM-017
- term: veto
  definition: The power to say 'I forbid' and block an official decision.
  example: One consul vetoed the other, so nothing happened until they agreed.
  notes: Veto is Latin for 'I forbid'. In the Republic each consul could veto the other consul, and tribunes could veto magistrates. The rule stopped any one man from acting alone, which was the whole point of a republic.
  zh: 否决权（“我禁止”）
  image: ROM-018.svg
  vex_id: ROM-018
- term: latifundia
  definition: Huge Roman farms worked by enslaved people instead of paid workers.
  example: Small farmers could not compete with latifundia run by slaves.
  notes: Patricians spent their war profits on cheap land and joined it into giant estates called latifundia. Unpaid enslaved workers harvested the crops, so free farmers could not sell grain at any price that covered their costs.
  zh: 奴隶制大庄园
  image: ROM-019.svg
  vex_id: ROM-019
- term: chattel slavery
  definition: Treating people as property that can be bought, sold and owned.
  example: Chattel slavery let a master sell a person like a farm animal.
  notes: 'Chattel means ''movable property''. Roman law called an enslaved person a thing, not a person: if someone broke a slave''s bone, the fine of 150 coins went to the master, not the injured slave. By 100 BCE about one in three people in Italy was enslaved.'
  zh: 人身买卖奴隶制
  image: ROM-020.svg
  vex_id: ROM-020
