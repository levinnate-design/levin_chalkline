unit: 91
unit_title: "TEST UNIT 1: Ancient Greece"
terms:
- term: peninsula
  definition: Land with water on three sides.
  example: Greece is a peninsula, so most Greeks lived near the sea.
  notes: Most of Greece is a rocky, mountainous peninsula. Travel by sea was often easier than travel over the mountains.
  zh: 半岛
  image: GRC-001.svg
  vex_id: GRC-001
- term: city-state
  definition: A city and the land around it, with its own government.
  example: Athens and Sparta were rival city-states.
  notes: Ancient Greece was not one country. It had hundreds of city-states, each with its own laws, army and money. Athens and Sparta were the most famous.
  zh: 城邦
  image: GRC-002.svg
  vex_id: GRC-002
- term: democracy
  definition: Government where citizens make decisions by voting.
  example: In a democracy, every citizen gets a vote.
  notes: 'Athens started a democracy around 508 BC. The word comes from Greek: demos means people and kratos means power.'
  zh: 民主
  image: GRC-003.svg
  vex_id: GRC-003
- term: citizen
  definition: A member of a city-state with rights, like the right to vote.
  example: Only citizens could speak in the Assembly.
  notes: In Athens, only free men with Athenian parents were citizens. Women, enslaved people and foreigners could not vote.
  zh: 公民
  image: GRC-004.svg
  vex_id: GRC-004
- term: assembly
  definition: A meeting where citizens discuss and vote on laws.
  example: The Assembly voted to build new warships.
  notes: The Athenian Assembly met on a hill called the Pnyx. Thousands of citizens came to listen, argue and vote.
  zh: 公民大会
  image: GRC-005.svg
  vex_id: GRC-005
- term: vote
  definition: To choose officially, for example by raising your hand.
  example: 'Let''s vote: hands up for option A.'
  notes: Athenians usually voted by raising their hands. In courts, jurors voted by dropping a small token into a jar.
  zh: 投票
  image: GRC-006.svg
  vex_id: GRC-006
- term: Olympic Games
  definition: Sports contests at Olympia every four years, to honor Zeus.
  example: Running was the oldest event at the Olympic Games.
  notes: The first recorded Games were in 776 BC. Athletes came from many city-states. The oldest event was a running race.
  zh: 奥林匹克运动会
  image: GRC-007.svg
  vex_id: GRC-007
- term: myth
  definition: A traditional story about gods and heroes.
  example: In the myth, Athena wins a contest to protect Athens.
  notes: Greek myths explained nature and taught lessons. The Greeks believed the most important gods lived on Mount Olympus.
  zh: 神话
  image: GRC-008.svg
  vex_id: GRC-008
- term: philosopher
  definition: A thinker who asks big questions about life and truth.
  example: The philosopher asked, "What makes a good life?"
  notes: Socrates taught by asking questions. His student Plato wrote down his ideas, and Plato taught Aristotle.
  zh: 哲学家
  image: GRC-009.svg
  vex_id: GRC-009
- term: temple
  definition: A building where people worship a god or goddess.
  example: The temple had a giant statue of Athena inside.
  notes: The Parthenon in Athens was a temple to the goddess Athena. It stands on a hill called the Acropolis.
  zh: 神庙
  image: GRC-010.svg
  vex_id: GRC-010
- term: column
  definition: A tall post that holds up a roof.
  example: Count the columns on the front of the Parthenon.
  notes: 'Greek columns came in three styles: Doric (plain top), Ionic (scrolls) and Corinthian (leaves).'
  zh: 柱子
  image: GRC-011.svg
  vex_id: GRC-011
- term: theater
  definition: An outdoor place for plays, with seats in a half circle.
  example: Thousands of people watched plays in the theater.
  notes: Greek plays were tragedies or comedies. Actors wore masks, and the seats were built into a hillside so everyone could hear.
  zh: 剧场
  image: GRC-012.svg
  vex_id: GRC-012
- term: colony
  definition: A new town started by people from another city.
  example: Marseille in France began as a Greek colony.
  notes: Greek city-states started colonies all around the Mediterranean and Black Seas, to find farmland and to trade.
  zh: 殖民地
