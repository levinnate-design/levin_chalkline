unit: 1
unit_title: Ancient River Civilizations
terms:
- term: civilization
  definition: A complex society with cities, government, writing, and specialized jobs.
  example: Sumer in Mesopotamia is often called one of the world's first civilizations.
  notes: 'Historians identify five main characteristics of civilization: advanced cities, specialized workers, complex institutions, record keeping, and advanced technology.'
  zh: 文明
  vex_id: RIV-001
- term: silt
  definition: Fine, fertile soil left behind on the land after a river floods.
  example: Farmers planted wheat and barley in the rich silt after the floodwaters receded.
  notes: Every year, flooded rivers like the Tigris, Euphrates, Nile, and Indus spread thick, nutrient-rich mud called silt across the valley floor, making the land ideal for farming.
  zh: 淤泥／肥沃泥沙
  vex_id: RIV-002
- term: irrigation
  definition: Canals and ditches built to bring river water to dry farmland.
  example: Irrigation allowed Sumerian farmers to grow a surplus of grain even during dry months.
  notes: Because rainfall was scarce in Mesopotamia and Egypt, farmers dug irrigation canals, dikes, and basins to carry river water to their fields and control flooding.
  zh: 灌溉
  vex_id: RIV-003
- term: surplus
  definition: Extra food or goods beyond what a community immediately needs.
  example: A steady food surplus allowed villages to grow into large cities.
  notes: When irrigation produced a food surplus, not everyone had to farm. Extra grain could be stored for droughts, traded with neighbors, or used to feed builders and artisans.
  zh: 剩余（粮食）
  vex_id: RIV-004
- term: division of labour
  definition: A system where people do different specialized jobs instead of all farming.
  example: A food surplus led to a division of labour in early cities.
  notes: Once farmers grew a food surplus, other people could specialize as potters, weavers, metalworkers, scribes, priests, or soldiers.
  zh: 社会分工
  vex_id: RIV-005
- term: cultural diffusion
  definition: The spread of ideas, beliefs, and technology from one culture to another.
  example: Through long-distance trade, cultural diffusion spread Sumerian ideas across Southwest Asia.
  notes: As river valley cities traded and migrated, they exchanged goods, writing systems, religious ideas, and technologies like bronze-working and chariots.
  zh: 文化传播
  vex_id: RIV-006
- term: primary source
  definition: An artifact or document created during the historical period being studied.
  example: The Code of Hammurabi carved on a stone stele is a primary source from Babylon.
  notes: Examples of primary sources include clay cuneiform tablets, the Stele of Hammurabi, Egyptian papyrus scrolls, pyramid tombs, and Harappan stone seals.
  zh: 第一手史料
  vex_id: RIV-007
- term: secondary source
  definition: An account of the past written later by someone who was not there.
  example: Your world history textbook is a secondary source.
  notes: History textbooks, encyclopedias, and modern museum articles are secondary sources because they analyze and interpret primary sources long after the events happened.
  zh: 第二手史料
  vex_id: RIV-008
- term: Fertile Crescent
  definition: An arc of rich farmland in Southwest Asia between the Persian Gulf and Sea.
  example: The Fertile Crescent curves like a quarter-moon from the Persian Gulf to the Mediterranean Sea.
  notes: Curving from the Persian Gulf through the Tigris and Euphrates valleys to the eastern Mediterranean coast, the Fertile Crescent provided the water and wild grains needed for early farming.
  zh: 新月沃地
  vex_id: RIV-009
- term: Mesopotamia
  definition: The land between the Tigris and Euphrates rivers in modern Iraq.
  example: Mesopotamia lay on a flat plain watered by the Tigris and Euphrates rivers.
  notes: The name Mesopotamia comes from Greek words meaning 'land between the rivers.' It was home to Sumer, Akkad, Babylon, and Assyria.
  zh: 美索不达米亚（两河流域）
  vex_id: RIV-010
- term: city-state
  definition: A city and the land around it, with its own government.
  example: Athens and Sparta were rival city-states.
  notes: Ancient Greece was not one country. It had hundreds of city-states, each with its own laws, army and money. Athens and Sparta were the most famous.
  zh: 城邦
  image: GRC-002.svg
  vex_id: GRC-002
- term: dynasty
  definition: A series of rulers who all come from the same family.
  example: The king passed the throne to his son, starting a new dynasty.
  notes: When Sumerian military leaders became full-time kings, they passed power down to their sons, forming dynasties. Egyptian history is also divided into more than 30 dynasties.
  zh: 王朝／朝代
  vex_id: RIV-011
- term: polytheism
  definition: The belief in and worship of many gods and goddesses.
  example: Polytheism shaped daily life as priests offered sacrifices to many gods.
  notes: Sumerians and Egyptians were polytheistic. They believed different gods controlled rain, flooding, harvests, war, and the afterlife.
  zh: 多神教
  vex_id: RIV-012
- term: ziggurat
  definition: A tiered, pyramid-shaped mud-brick temple tower in Mesopotamia.
  example: The Great Ziggurat of Ur rose high above the flat Mesopotamian plain.
  notes: At the center of every Sumerian city-state stood a massive walled ziggurat. Priests climbed its long staircases to offer sacrifices to the city's patron god, while the complex also stored grain and tax records.
  zh: 吉库拉特（阶梯神庙）
  vex_id: RIV-013
- term: cuneiform
  definition: Sumerian wedge-shaped writing pressed into wet clay tablets.
  example: Scribes used a reed stylus to press cuneiform signs into wet clay.
  notes: Invented in Sumer around 3000 BCE, cuneiform was written by pressing a reed stylus into soft clay to record grain taxes, trade contracts, laws, and literature like the Epic of Gilgamesh.
  zh: 楔形文字
  vex_id: RIV-014
- term: empire
  definition: Many lands and peoples ruled by one government.
  example: The empire's roads ran from Britain to Egypt.
  notes: At its largest, the Roman Empire went all the way around the Mediterranean Sea. Its western half fell in AD 476.
  zh: 帝国
  image: ROM-005.svg
  vex_id: ROM-005
- term: Code of Hammurabi
  definition: A Babylon law code of 282 laws carved in stone around 1750 BCE.
  example: The Code of Hammurabi was carved on tall stone pillars placed in public for all to see.
  notes: Compiled by King Hammurabi of Babylon, the 282 laws regulated property, family life, trade, and crime. It used retaliation ('an eye for an eye') but gave different punishments depending on social class.
  zh: 《汉谟拉比法典》
  vex_id: RIV-015
- term: cataract
  definition: Shallow, rocky rapids along the Nile River that blocked boats.
  example: Granite boulders and churning water at the First Cataract blocked enemy ships.
  notes: Churning rapids called cataracts in southern (Upper) Egypt made it impossible for riverboats to sail directly between the Mediterranean coast and the interior of Africa.
  zh: （尼罗河）浅滩／急流
  vex_id: RIV-016
- term: delta
  definition: A fan-shaped area of fertile marshland at the mouth of a river.
  example: Rich farmland covered the broad, marshy Nile Delta in Lower Egypt.
  notes: In Lower Egypt, the last 100 miles of the Nile split into many channels before emptying into the Mediterranean Sea, forming the triangle-shaped Nile Delta.
  zh: 三角洲
  vex_id: RIV-017
- term: pharaoh
  definition: The king of Ancient Egypt, worshipped as a living god.
  example: The pharaoh wore a double crown uniting Upper and Lower Egypt.
  notes: Unlike Mesopotamian kings who were seen as representatives of the gods, Egyptian pharaohs were believed to be living gods (the sky god Horus in life) who caused the sun to rise and the Nile to flood.
  zh: 法老
  vex_id: RIV-018
- term: theocracy
  definition: Government in which rule is based on religious authority.
  example: Ancient Egypt was a theocracy because its king was also worshipped as a god.
  notes: Because the pharaoh stood at the center of both Egypt's religion and its government and army, Egypt's system of rule was a theocracy.
  zh: 神权政治
  vex_id: RIV-019
- term: ka
  definition: In ancient Egypt, the eternal spirit or life force of a person.
  example: Priests left food and drink in the tomb to nourish the pharaoh's ka.
  notes: Egyptians believed a king's ka continued to rule and needed food, clothing, and a preserved body in the afterlife, which is why tombs were filled with treasures and offerings.
  zh: 卡（古埃及人的灵魂／生命力）
  vex_id: RIV-020
- term: mummification
  definition: Drying and wrapping a dead body so it does not decay.
  example: Mummification preserved the pharaoh's body for thousands of years inside the tomb.
  notes: Embalmers removed internal organs (placing them in canopic jars), dried the body with natron salt, and wrapped it in linen bandages so the person's soul could recognize its body in the afterlife.
  zh: 木乃伊制作（防腐处理）
  vex_id: RIV-021
- term: pyramid
  definition: A monumental stone tomb built for Old Kingdom Egyptian pharaohs.
  example: The Great Pyramid at Giza was built as a giant stone tomb for a pharaoh.
  notes: Built from millions of heavy limestone and granite blocks by peasant laborers during the Nile flood season, pyramids served as eternal resting places for pharaohs' mummies and treasures.
  zh: 金字塔
  vex_id: RIV-022
- term: hieroglyphics
  definition: The ancient Egyptian writing system using pictures and symbols.
  example: Egyptian scribes carved hieroglyphics onto stone temple walls.
  notes: From Greek words meaning 'sacred carving,' hieroglyphics began as picture signs for objects and later stood for sounds and ideas. Scribes carved them on temple walls and wrote them on papyrus.
  zh: 古埃及象形文字
  vex_id: RIV-023
- term: papyrus
  definition: A paper-like writing sheet made from reeds along the Nile River.
  example: Scribes wrote tax records and medical guides with ink on sheets of papyrus.
  notes: Egyptians split tall papyrus reeds that grew in the marshy delta, pressed overlapping strips together, and dried them into lightweight scrolls that were much easier to carry than clay tablets.
  zh: 纸莎草（纸）
  vex_id: RIV-024
- term: Rosetta Stone
  definition: A stone slab with three scripts that unlocked Egyptian hieroglyphics.
  example: By comparing the Greek text on the Rosetta Stone, scholars finally read hieroglyphics.
  notes: Found in 1799 CE near the Nile Delta, the Rosetta Stone had the same royal decree carved in hieroglyphics, simpler demotic script, and ancient Greek, allowing Jean-François Champollion to decipher hieroglyphics in 1822.
  zh: 罗塞塔石碑
  vex_id: RIV-025
- term: subcontinent
  definition: A large landmass set apart from the rest of a continent by mountains.
  example: Tall mountains separate the Indian subcontinent from the rest of Asia.
  notes: India, Pakistan, and Bangladesh form the Indian subcontinent because the towering Himalaya, Hindu Kush, and Karakoram mountain ranges wall them off from the rest of Asia.
  zh: 次大陆
  vex_id: RIV-026
- term: monsoon
  definition: Seasonal winds that bring dry air in winter and heavy rain in summer.
  example: Farmers in the Indus Valley depended on the summer monsoon rains to water their crops.
  notes: From October to February, winter monsoons blow dry air from the northeast. From June to October, summer monsoons blow moisture from the Indian Ocean, bringing heavy rains and flooding.
  zh: 季风
  vex_id: RIV-027
- term: Harappan civilization
  definition: The ancient Indus Valley civilization known for its planned cities.
  example: Harappan civilization cities had brick sewers and private bathrooms in almost every house.
  notes: Named after the archaeological site of Harappa, the Harappan civilization (c. 2500–1750 BCE) built over 100 uniform, grid-planned brick cities across the Indus River valley, including Mohenjo-Daro.
  zh: 哈拉帕文明（印度河流域文明）
  vex_id: RIV-028
- term: Indo-Gangetic Plain
  definition: The fertile northern plain watered by the Indus and Ganges rivers.
  example: Melting snow from the Himalayas feeds the rivers of the Indo-Gangetic Plain.
  notes: Stretching 1,700 miles across northern India and Pakistan between the Himalayas and the southern peninsula, this rich lowland plain was formed by silt from the Indus and Ganges rivers.
  zh: 印恒平原
  vex_id: RIV-029
- term: citadel
  definition: A fortified high area inside an Indus city protecting major buildings.
  example: The citadel stood on a high mud-brick platform surrounded by a thick wall.
  notes: In planned Indus cities like Mohenjo-Daro and Harappa, engineers built a thick-walled mud-brick platform called a citadel to hold public buildings like the Great Bath and granaries above floodwaters.
  zh: 卫城／内城要塞
  vex_id: RIV-030
- term: grid system
  definition: City streets laid out in straight lines intersecting at right angles.
  example: Mohenjo-Daro's streets were laid out on a neat grid system with right-angle corners.
  notes: While early Mesopotamian cities were a jumble of winding alleys, Indus engineers planned Harappa and Mohenjo-Daro on a precise north-south, east-west grid system with oven-baked bricks of standard sizes.
  zh: 网格状街道规划
  vex_id: RIV-031
- term: Harappan seals
  definition: Carved stone stamps with animals and script used by Indus merchants.
  example: Archaeologists found Harappan seals in Mesopotamia, proving the two regions traded.
  notes: Pressed into clay tags on bundles of trade goods, Harappan stone seals show animals (like bulls, elephants, and rhinos) and an undeciphered script. Seals found in Sumer prove the Indus traded with Mesopotamia.
  zh: 哈拉帕印章
  vex_id: RIV-032
