# Teacher profile. Used only when you run:  quarto render --profile teacher
# These settings are layered on top of _quarto.yml.
#
# Anything wrapped in  ::: {.content-visible when-profile="teacher"}  shows up
# only in this build (answer keys, teacher notes).

project:
  output-dir: _site-teacher  # keep teacher files separate so they never get mixed up

website:
  title: "Mingwan School · Social Studies (TEACHER)"
  sidebar:
    contents:
      - text: "Overview"
        href: index.qmd
      - text: "History vocab 词汇"
        href: vocab/app/index.html
        icon: book
      - text: "All slides 所有幻灯片"
        href: all-slides.qmd
        icon: grid-3x3-gap
      - text: "Review games 复习游戏"
        href: course/review-games.qmd
        icon: controller
      - text: "Play at home 课后闯关"
        href: course/play.qmd
        icon: phone
      - text: "Command Terms 指令词"
        href: course/references/command-terms.qmd
        icon: card-checklist
      - text: "Assessment Criteria 评估标准"
        href: course/references/assessment-criteria.qmd
        icon: award
      - text: "For families 给家长"
        href: families.qmd
        icon: house-heart
      - auto: course/units
      - auto: course/summatives
      - section: "Teachers Only 教师专区"
        contents:
          - text: "Co-Teacher Onboarding 教师协作指南"
            href: course/teacher/co-teacher-onboarding.qmd
          - text: "AI Assistant Prompts 提示词指南"
            href: course/teacher/ai-prompts.qmd
          - text: "Quick Start 快速上手"
            href: course/teacher/start-here/quick-start.qmd
          - text: "Chalkline Tour 课件系统演示"
            href: course/teacher/start-here/slides.qmd
          - text: "Slide Kit & Schemes 双语课件套件"
            href: course/teacher/start-here/slide-kit-slides.qmd
          - text: "Test Unit 1: Ancient Greece"
            href: course/teacher/test-units/91-test-unit-1-ancient-greece/index.qmd
          - text: "Test Unit 2: Ancient Rome"
            href: course/teacher/test-units/92-test-unit-2-ancient-rome/index.qmd

edition: Teacher Edition       # printed on the corner tab of teacher PDFs

pdf-viewer:                    # slides show the student copy of a PDF (no answer keys) when there is one:
  prefer: "{name}-student.pdf" # scripts/packets.py writes it next to the teacher edition. To show the
                               # teacher edition on a slide (say, for training), add prefer=false to it.
